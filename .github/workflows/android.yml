name: Android APK

on:
  push:
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate Android project from the web app
        run: |
          npm run prepare-web
          npx cap add android
          npx cap sync android

      - name: Use the ledger icon
        run: |
          res=android/app/src/main/res
          rm -rf "$res/mipmap-anydpi-v26"
          for d in res-icons/mipmap-*; do cp "$d"/*.png "$res/$(basename "$d")/"; done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../villa-ledger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: villa-ledger-apk
          path: android/villa-ledger.apk

      - name: Publish to the "Villa Ledger app" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=villa-ledger-latest
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Villa Ledger app (Android)" --notes "Latest Android build of the Villa Expense Ledger. Download villa-ledger.apk on the phone and open it to install."
          gh release upload "$tag" villa-ledger.apk --clobber
